# syntax=docker-registry.wikimedia.org/repos/releng/blubber/buildkit:v1.8.0
version: v4
# We depend on this image having git installed
base: docker-registry.wikimedia.org/golang1.24
variants:
  download-deps:
    lives:
      in: /src
      # Needed to be able to modify the go cache at test time
      # can't use `runuser` directly or it will fail setting the users up
      uid: 900
    copies:
      - local
    runs:
      environment:
        GOMODCACHE: /tmp/go-mod
        GOCACHE: /tmp/go-build
    builders:
      - custom:
          requirements: [go.mod, go.sum]
          command:
            - go
            - mod
            - download
      - custom:
          requirements: [./]
          command:
            - make
            - build-api

  test:
    includes:
      - download-deps
    entrypoint:
      - go
      - test
      - ./...

  image:
    lives:
      in: /src
    copies:
      - from: download-deps
        source: /src/builds-api
        destination: /builds-api
    entrypoint: [/builds-api]
